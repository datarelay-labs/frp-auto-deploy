name: lint
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Pin FRP 0.70.1 integration test binaries
        run: |
          FRP_VERSION=0.70.1
          FRP_ARCH=amd64
          curl -fsSL -o /tmp/frp.tgz \
            "https://github.com/fatedier/frp/releases/download/v${FRP_VERSION}/frp_${FRP_VERSION}_linux_${FRP_ARCH}.tar.gz"
          tar -xzf /tmp/frp.tgz -C /tmp
          sudo install -m 0755 "/tmp/frp_${FRP_VERSION}_linux_${FRP_ARCH}/frps" /usr/local/bin/frps
          test -x "/tmp/frp_${FRP_VERSION}_linux_${FRP_ARCH}/frpc"
      - name: Full local non-Docker suite
        run: ./tests/run-all.sh
      # Live distro containers cannot validate systemd unless PID 1 is systemd.
      # Package install + Bash/Python/CLI checks run in a separate matrix job.
      - name: Build standalone bundles
        run: |
          ./scripts/build-bundles.sh
          git diff --exit-code dist/
      - name: SHA256SUMS
        run: ./scripts/verify-sha256sums.sh

  portability-containers:
    name: distro ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with tests/distro-images.txt (checked by tests/test-distro-matrix.sh).
        image:
          - ubuntu:22.04
          - ubuntu:24.04
          - rockylinux:9
          - almalinux:9
          - amazonlinux:2023
          - amazonlinux:2
    steps:
      # actions/checkout@v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Container package and CLI portability
        run: ./tests/run-distro-matrix.sh --image ${{ matrix.image }}
        # Uses the same Docker invocation as local ./tests/run-distro-matrix.sh.
        # Does not start systemd. SYSTEMD_SMOKE remains NOT_TESTED.
