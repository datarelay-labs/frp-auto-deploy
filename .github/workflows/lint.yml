name: lint
on:
  push:
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: |
          git ls-files '*.sh' | xargs -r bash -n
          bash -n tools/frp-server-status tools/frp-update tools/frp-client tools/frpctl
      - name: Python compile
        run: |
          python3 -m py_compile server/frp-port-allocator.py server/migrate_token.py scripts/build-bundles.py lib/frp_mgmt_auth.py lib/frp_pki.py
          python3 -m py_compile tools/frp-create-client tools/frp-clients tools/frp-client-info tools/frp-release-client tools/frp-release-service tools/frp-revoke-client tools/frp-set-client-installer-url
          python3 -m py_compile tests/test-allocator.py tests/test-enrollment-security.py tests/test-mgmt-identity.py tests/test-pki-https.py
      - name: Migration regression tests
        run: |
          ./tests/test-server-migration.sh
          ./tests/test-registry-init.sh
      - name: Generic multi-service tests
        run: |
          python3 tests/test-allocator.py
          python3 tests/test-enrollment-security.py
          python3 tests/test-mgmt-identity.py
          ./tests/test-client-config.sh
          ./tests/test-client-allocator-url.sh
          ./tests/test-client-platform.sh
          ./tests/test-portability.sh
          ./tests/test-server-install-config.sh
          ./tests/test-allocator-ready.sh
          ./tests/test-create-client.sh
          ./tests/test-management-commands.sh
          ./tests/test-frp-client.sh
          ./tests/test-guided-ux.sh
          ./tests/test-client-upgrade.sh
          ./tests/test-frpctl.sh
          ./tests/test-frpctl-completion.sh
          ./tests/test-port-architecture.sh
          ./tests/test-ca-bootstrap.sh
          python3 tests/test-pki-https.py
      # Live distro containers cannot validate systemd unless PID 1 is systemd.
      # Package install + Bash/Python/CLI checks run in a separate matrix job.
      - name: Distro matrix harness self-tests
        run: ./tests/test-distro-matrix.sh
      - name: FRP update regression tests
        run: |
          ./tests/test-frp-update.sh
          ./tests/test-frp-server-status.sh
      - name: Secret and environment-literal scan
        run: ./scripts/secret-scan.sh
      - name: Build standalone bundles
        run: |
          ./scripts/build-bundles.sh
          git diff --exit-code dist/
      - name: Whitespace
        run: git diff --check HEAD

  portability-containers:
    name: distro ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with tests/distro-images.txt (checked by tests/test-distro-matrix.sh).
        image:
          - ubuntu:22.04
          - ubuntu:24.04
          - rockylinux:9
          - almalinux:9
          - amazonlinux:2023
          - amazonlinux:2
    steps:
      - uses: actions/checkout@v4
      - name: Container package and CLI portability
        run: ./tests/run-distro-matrix.sh --image ${{ matrix.image }}
        # Uses the same Docker invocation as local ./tests/run-distro-matrix.sh.
        # Does not start systemd. SYSTEMD_SMOKE remains NOT_TESTED.
