name: lint
on:
  push:
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: |
          git ls-files '*.sh' | xargs -r bash -n
          bash -n tools/frp-server-status tools/frp-update
      - name: Python compile
        run: |
          python3 -m py_compile server/frp-port-allocator.py server/migrate_token.py scripts/build-bundles.py
          python3 -m py_compile tools/frp-create-client tools/frp-clients tools/frp-client-info tools/frp-release-client tools/frp-set-client-installer-url
          python3 -m py_compile tests/test-allocator.py tests/test-enrollment-security.py
      - name: Migration regression tests
        run: |
          ./tests/test-server-migration.sh
          ./tests/test-registry-init.sh
      - name: Generic multi-service tests
        run: |
          python3 tests/test-allocator.py
          python3 tests/test-enrollment-security.py
          ./tests/test-client-config.sh
          ./tests/test-management-commands.sh
      - name: FRP update regression tests
        run: |
          ./tests/test-frp-update.sh
          ./tests/test-frp-server-status.sh
      - name: Secret scan
        run: ./scripts/secret-scan.sh
      - name: Build standalone bundles
        run: |
          ./scripts/build-bundles.sh
          git diff --exit-code dist/
      - name: Whitespace
        run: git diff --check HEAD
